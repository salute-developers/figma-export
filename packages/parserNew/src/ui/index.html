<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>parserNew</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                font-size: 12px;
                --bg: var(--figma-color-bg, #ffffff);
                --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
                --text: var(--figma-color-text, #1f1f1f);
                --text-secondary: var(--figma-color-text-secondary, #6b6b6b);
                --border: var(--figma-color-border, #dedede);
                --brand: var(--figma-color-bg-brand, #0d99ff);
                --on-brand: var(--figma-color-text-onbrand, #ffffff);
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                min-height: 100vh;
                color: var(--text);
                background: var(--bg);
            }

            button, input { font: inherit; }

            .app {
                display: grid;
                grid-template-rows: auto auto 1fr auto;
                min-height: 100vh;
            }

            .header, .toolbar, .footer {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
            }

            .header { justify-content: space-between; }
            .header h1 { margin: 0; font-size: 16px; }
            .header p { margin: 3px 0 0; color: var(--text-secondary); }

            .toolbar input {
                min-width: 0;
                flex: 1;
                height: 32px;
                padding: 0 10px;
                color: var(--text);
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 6px;
                outline: none;
            }

            .toolbar input:focus { border-color: var(--brand); }

            button {
                height: 32px;
                padding: 0 12px;
                color: var(--text);
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
            }

            button.primary { color: var(--on-brand); background: var(--brand); border-color: var(--brand); }
            button:disabled { opacity: 0.45; cursor: default; }

            .content { min-height: 0; overflow: auto; padding: 12px 16px 20px; }

            .status {
                display: grid;
                place-items: center;
                min-height: 320px;
                color: var(--text-secondary);
                text-align: center;
            }

            .progress { width: 240px; height: 4px; overflow: hidden; background: var(--bg-secondary); border-radius: 999px; }
            .progress > span { display: block; height: 100%; background: var(--brand); transition: width 120ms ease; }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 8px;
            }

            .card {
                min-width: 0;
                padding: 10px;
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 8px;
            }

            .preview {
                display: grid;
                place-items: center;
                height: 54px;
                margin-bottom: 8px;
                background: var(--bg);
                border-radius: 5px;
            }

            .preview img { width: 32px; height: 32px; }
            .name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
            .meta { margin-top: 4px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

            .footer {
                justify-content: space-between;
                border-top: 1px solid var(--border);
                border-bottom: 0;
            }

            .summary { color: var(--text-secondary); }
            .actions { display: flex; gap: 8px; }
            .issues { color: #d97706; }
        </style>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
